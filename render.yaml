# Render Blueprint — https://render.com/docs/blueprint-spec
# Node web service: builds the Vite frontend and runs the Express server,
# which serves dist/ and the Stripe Checkout API from a single URL.
services:
  - type: web
    name: vetu-ecommerce
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      # Vite 8 needs a modern Node; pin it so Render's default can't break the build.
      - key: NODE_VERSION
        value: "22.16.0"
      # Set these in the Render dashboard (kept out of git):
      - key: STRIPE_SECRET_KEY      # sk_test_... or sk_live_...
        sync: false
      - key: VITE_ADMIN_PASSCODE    # admin console passcode
        sync: false
