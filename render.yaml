# Render Blueprint — https://render.com/docs/blueprint-spec
# Node web service: builds the Vite frontend and runs the Express server,
# which serves dist/ and the multi-gateway checkout API from a single URL.
services:
  - type: web
    name: vetu-ecommerce
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    # For durable gateway keys set via the admin UI, attach a disk (paid plans):
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
    # …and set DATA_DIR=/data below. Otherwise set keys as env vars (persistent).
    envVars:
      # Vite 8 needs a modern Node; pin it so Render's default can't break the build.
      - key: NODE_VERSION
        value: "22.16.0"
      # Active gateway + its currency (not secret).
      - key: ACTIVE_GATEWAY
        value: korapay
      - key: KORAPAY_CURRENCY
        value: NGN
      # The ONLY value you must enter in the dashboard when applying the blueprint.
      - key: KORAPAY_SECRET_KEY
        sync: false
      # Admin passcode — change these in the dashboard for real security.
      - key: ADMIN_PASSCODE
        value: vetu-admin
      - key: VITE_ADMIN_PASSCODE
        value: vetu-admin
      # Other gateways (Paystack / Flutterwave / Stripe): add their keys later in the
      # dashboard or via the admin UI — they aren't required to deploy.
